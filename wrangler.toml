name = "aigarbage"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Create with: wrangler kv namespace create BLOG_KV
# then paste the printed id below.
kv_namespaces = [
  { binding = "BLOG_KV", id = "d06612ad4b964850af08caa12209cfeb" }
]

# Custom domain on a VERIFIED-UNUSED subdomain. Audited against all DNS records,
# Worker routes and Worker custom domains before binding (zhijian = 智见 pinyin,
# avoids the obviously-AI "aigarbage" name). Wrangler creates a clean DNS + cert.
routes = [
  { pattern = "zhijian.011203.dpdns.org", custom_domain = true }
]

# Workers AI binding (text + image). No API key needed.
[ai]
binding = "AI"

# Scheduled generation: two articles/day at 00:00 and 12:00 UTC. One 70B
# article ~= 1.8k neurons, so 2/day (~3.6k) sits well under the free 10k/day cap.
[triggers]
crons = ["0 */12 * * *"]

[vars]
NEWS_API_BASE = "https://news.011203.xyz"
# Comma-separated newsnow source ids. Add as many as you like.
SOURCES = "huxiu,zhihu,36kr,weibo,baidu,ithome,wallstreetcn"
# High-quality 70B for all text agents (user preference). Note: one long
# article (~6.7k neurons text + ~2.7k images) sits close to the FREE-tier
# 10,000 neurons/day cap, so heavy extra usage in a day can exhaust it. For
# more headroom: configure a custom model in /admin or upgrade to Workers Paid.
AI_MODEL_SELECT = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_WRITE = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_REVIEW = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Cover-image agent.
AI_MODEL_IMAGE = "@cf/black-forest-labs/flux-1-schnell"
# Minimum Chinese characters. Kept moderate on purpose: the 3-part skeleton
# (hook+background -> ~1500-char human story -> impact/closing) is usually
# ~2.5k-4k already; a low floor avoids padding it with repetitive filler.
MIN_CHARS = "2500"
# Max continuation rounds used to reach MIN_CHARS.
REVIEW_MAX_REVISIONS = "4"
IMAGE_WIDTH = "1024"
IMAGE_HEIGHT = "576"
# Images per article (1 cover + the rest inline). Capped at 6.
IMAGE_COUNT = "5"
WRITE_MAX_TOKENS = "4096"
SITE_TITLE = "智见"
SITE_DESC = "洞察前沿热点，解读时代趋势"

# Admin console login. Demo: user "admin" / pass "admin888".
# Override the password in production with: wrangler secret put ADMIN_PASS
ADMIN_USER = "admin"
# Cloudflare Turnstile (login human check). Real keys are stored as SECRETS
# (never committed):
#   wrangler secret put TURNSTILE_SITE_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY
# If unset, the code falls back to Cloudflare's always-pass TEST keys.

# ADMIN_KEY is a secret (protects /admin/generate, also signs sessions):
#   wrangler secret put ADMIN_KEY
# For local dev put it in .dev.vars
